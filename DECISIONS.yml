version: "1.0"
decisions:
  Platform:
    - id: platform-001-supported-host
      decision: "Support only Ubuntu 24.04 LTS on AMD Ryzen AI Max+ 395."
      status: "⚠️Discussion Approved"
      link: "records/local-ai-setup-baseline.md"
    - id: platform-002-rocm-version-policy
      decision: "Prioritize the newest ROCm 10.x release validated for this host, pin exact versions, and allow app-specific ROCm user-space when needed; verify compatibility with the host driver."
      status: "⚠️Discussion Approved"
      link: "records/local-ai-setup-baseline.md"
      sub_decisions:
        - id: platform-002-1-compatibility-gate
          decision: "If a required app has no validated runtime path, report the incompatibility; do not silently omit the app or downgrade host ROCm."
          status: "⚠️Discussion Approved"
  Applications:
    - id: applications-001-supported-ai-stack
      decision: "Support llama.cpp, Ollama, vLLM, SD.Next (the selected Stable Diffusion WebUI), and ComfyUI. Install validated, pinned releases; model downloads are out of scope."
      status: "⚠️Discussion Approved"
      link: "records/local-ai-setup-baseline.md"
  Runtime:
    - id: runtime-001-per-app-python-pytorch
      decision: "Where required, pin Python and PyTorch per application and keep environments app-local. Use installed proto first, otherwise mise; if neither exists, report a prerequisite error and stop without installing a manager."
      status: "⚠️Discussion Approved"
      link: "records/local-ai-setup-baseline.md"
    - id: runtime-002-vllm-build-fallback
      decision: "Use a compatible stable vLLM wheel when available; otherwise build from a pinned upstream commit and validate the build and GPU smoke test. Do not use an unpinned nightly."
      status: "⚠️Discussion Approved"
      link: "records/local-ai-setup-baseline.md"
  Installation:
    - id: installation-001-installer-contract
      decision: "Root install.sh runs the full one-shot setup with no arguments, displays usage for --help, and supports curl | bash."
      status: "⚠️Discussion Approved"
      link: "records/local-ai-setup-baseline.md"
      sub_decisions:
        - id: installation-001-1-install-scope
          decision: "Keep AI apps and per-app environments user-owned. Use an app's user-level global mode when available; otherwise install it under the invoking project directory. Use sudo only for OS and host ROCm dependencies."
          status: "⚠️Discussion Approved"
        - id: installation-001-2-existing-state
          decision: "Preserve compatible existing versions; report incompatibilities instead of silently overwriting or downgrading an existing installation."
          status: "⚠️Discussion Approved"
  Testing:
    - id: testing-001-install-test
      decision: "The root install.test.sh tests installer behavior without sudo or real system installations."
      status: "⚠️Discussion Approved"
      link: "records/local-ai-setup-baseline.md"
